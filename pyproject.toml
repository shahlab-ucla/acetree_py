[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acetree-py"
version = "0.2.0"
description = "Python reimplementation of AceTree for C. elegans embryogenesis visualization"
readme = {text = "Python reimplementation of AceTree for C. elegans embryogenesis visualization.", content-type = "text/plain"}
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "tifffile>=2023.1",
    "typer>=0.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = [
    "napari[all]>=0.5,<0.7; python_version < '3.14' and (platform_system != 'Darwin' or platform_machine != 'x86_64')",
    # Triangle has no Intel macOS Python 3.13 wheel; retain the other extras.
    "napari[pyqt5,optional-base,optional-numba,bermuda]>=0.5,<0.7; python_version < '3.14' and platform_system == 'Darwin' and platform_machine == 'x86_64'",
    # Numba 0.62.x is the last series providing Intel macOS wheels.
    "numba>=0.62.1,<0.63; platform_system == 'Darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
    "napari[all]>=0.7.1,<0.8; python_version >= '3.14'",
    "qtpy>=2.3",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "ruff>=0.1",
]
all = ["acetree-py[gui,dev]"]

[project.scripts]
acetree-py = "acetree_py.__main__:app"
acetree-starrynite-export-model = "acetree_py.tracking.starrynite.oracle.model_export:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "matlab_oracle: requires a local MATLAB installation and StarryNite checkout",
]

[tool.ruff]
line-length = 100
target-version = "py310"
